<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="50%" stop-color="#0F0F1B"/>
      <stop offset="100%" stop-color="#16162A"/>
    </linearGradient>
    <linearGradient id="sparkOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B00"/>
      <stop offset="50%" stop-color="#E85D04"/>
      <stop offset="100%" stop-color="#D00000"/>
    </linearGradient>
    <linearGradient id="sparkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#E85D04" stroke-opacity="0.4" stroke-width="8"/>
  
  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="140" fill="#E85D04" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Alpha Spark Stylized "A" + Spark Symbol -->
  <g filter="url(#glow)">
    <!-- Left Leg of 'A' -->
    <path d="M 155 380 L 235 130 C 240 115 265 115 270 130 L 300 220 L 240 270 L 195 380 Z" fill="url(#sparkOrange)"/>
    
    <!-- Right Leg of 'A' -->
    <path d="M 357 380 L 277 130 C 272 115 247 115 242 130 L 212 220 L 272 270 L 317 380 Z" fill="url(#sparkGold)"/>
    
    <!-- Central Lightning Spark Bolt -->
    <polygon points="256,90 285,210 235,240 280,390 220,260 270,230" fill="url(#sparkBlue)"/>
    
    <!-- Crossbar Spark Core -->
    <polygon points="190,285 322,285 280,315 220,315" fill="#FFFFFF" opacity="0.9"/>
  </g>
  
  <!-- Outer Energy Orbit Accents -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#sparkOrange)" stroke-width="3" stroke-dasharray="24 16" opacity="0.5"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#sparkBlue)" stroke-width="2" stroke-dasharray="12 20" opacity="0.4"/>
</svg>
